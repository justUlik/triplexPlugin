<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; font: 14px system-ui, sans-serif; color: #172e25; background: #f5f8f6; }
  body { margin: 0; padding: 20px; }
  [hidden] { display: none; }
  p { margin: 6px 0 12px; }
  .hint { color: #496057; font-size: 12px; line-height: 1.45; }
  label { display: block; margin: 8px 0; font-weight: 600; }
  input, select, textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 5px; padding: 8px;
    border-radius: 7px; border: 1px solid #a9bcb3; background: white; color: inherit; font: inherit; }
  textarea { resize: vertical; min-height: 72px; }
  button { border: 1px solid #a9bcb3; background: white; color: inherit; padding: 8px 12px; border-radius: 7px;
    font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: #087647; color: white; border-color: #087647; }
  button:disabled { opacity: .55; cursor: default; }
  details { margin: 12px 0; padding: 10px 12px; border: 1px solid #d5e0da; border-radius: 8px; background: white; }
  summary { font-weight: 600; cursor: pointer; }
  #items img { display: block; max-width: 100%; max-height: 300px; object-fit: contain; margin: 12px 0; }
  #items > li { padding: 12px; margin-bottom: 12px; border: 1px solid #d5e0da; border-radius: 8px; background: white; }
  #items input[type="checkbox"] { display: inline-block; width: auto; margin-left: 8px; }
  #componentChat, #flowChat { list-style: none; padding: 0; }
  .message { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; padding: 10px 12px; background: white; border-radius: 10px; }
  .message.user { background: #dcefe5; margin-left: 12%; }
  #status { min-height: 20px; line-height: 1.4; }
  #status.error { color: #a22222; }
</style>
</head>
<body>
<label>Размер LightBox
  <select id="lightboxSize">
    <option value="">Выберите размер</option>
    <option value="SM">SM</option>
    <option value="MD">MD</option>
    <option value="LG">LG</option>
    <option value="XL">XL</option>
  </select>
</label>
<button id="place" class="primary" type="button" disabled>Поставить</button>
<p class="hint">Выберите размер, чтобы активировать кнопку. Сборка UI 17.11.7</p>
<section id="formSetup" hidden>
  <details id="modelSettings">
    <summary>Настройки GigaCode CLI</summary>
    <label>Код из терминала <input id="token" type="password" autocomplete="off"></label>
    <label>Правила текстового стандарта Triplex <textarea id="standard" maxlength="8000" placeholder="Вставьте правила канала для этой формы"></textarea></label>
  </details>

  <p class="hint">Настройте LightBox на холсте. Выделите внутренний фрейм с автолейаутом или оставьте BodyPage по умолчанию.</p>
  <div id="startForm">
  <label>Что должно быть в форме
    <textarea id="task" maxlength="3000" placeholder="Например, форма инвестирования в ЦФА: количество, кошелёк и сумма инвестиции"></textarea>
  </label>
  <button id="prepare" class="primary" type="button">Предложить компоненты</button>
  </div>

</section>

<p id="status" role="status" aria-live="polite">Интерфейс загружается…</p>
<section id="plan" hidden>
  <h2 id="planTitle">1. Согласуйте набор компонентов</h2>
  <p id="target" class="hint"></p>
  <ol id="componentChat" role="log"></ol>
  <ol id="items"></ol>
  <div id="listActions">
  <label>Сообщение для GigaCode
    <textarea id="revision" maxlength="3000" placeholder="Убери телефон. Вместо поля «Тип» поставь список."></textarea>
  </label>
  <button id="revise" type="button">Отправить</button>
  <button id="openProperties" type="button">Подтвердить набор компонентов</button>
  </div>
  <button id="apply" hidden class="primary" type="button">Добавить на фрейм</button>
</section>

<details id="scenario" hidden>
  <summary>Дополнительно · состояния формы</summary>
  <ol id="flowChat" role="log"></ol>
  <label>Уточнение для сценария <textarea id="feedback" maxlength="2000"></textarea></label>
  <button id="flowSend" type="button">Предложить состояния</button>
  <button id="approveFlow" type="button" hidden>Утвердить состояния и ошибки</button>
  <button id="createStates" type="button" hidden>Создать состояния на фрейме</button>
</details>
<button id="retry" type="button" hidden>Повторить отправку</button>

<script>
const $ = id => document.getElementById(id);
let busy = false;
let lastRequest;
let lastModelRequest;
let pendingMessage;
let readDraft;
let previewTimer;
let replacePreview;
let imageTimer;
let activePreviewId;
let previewStage = '';
let previewUrl;
let formPlaced = false;
let componentCount = 0;
let stage = 'list';
let flowApproved = false;
let hasFlowDraft = false;
let hasSource = false;

function selectedSize() {
  return $('lightboxSize').value;
}
let placementTimer;

function post(type, data = {}) {
  parent.postMessage({ pluginMessage: { type, ...data } }, '*');
}

function status(text, error = false) {
  $('status').hidden = !text;
  $('status').textContent = text;
  $('status').classList.toggle('error', error);
}

function setBusy(value) {
  busy = value;
  for (const id of ['revise', 'revision', 'token', 'standard', 'feedback', 'flowSend', 'createStates']) {
    $(id).disabled = value;
  }
  $('approveFlow').hidden = !hasFlowDraft || flowApproved;
  $('approveFlow').disabled = value;
  $('scenario').hidden = stage !== 'done';
  $('retry').hidden = !lastRequest;
  $('retry').disabled = value;
  $('startForm').hidden = componentCount > 0;
  $('createStates').hidden = !hasSource || !flowApproved;
  $('items').querySelectorAll('input, select, textarea, button').forEach(control => { control.disabled = value; });
  $('openProperties').hidden = stage !== 'list';
  $('openProperties').disabled = value || !componentCount;
  $('listActions').hidden = !['list', 'copy', 'ready'].includes(stage);
  $('apply').hidden = stage !== 'ready';
  $('apply').disabled = value;
  $('place').disabled = value || !selectedSize();
  $('prepare').disabled = $('task').disabled = value || !formPlaced;
}

function resetPlan() {
  $('plan').hidden = true;
  $('target').textContent = '';
  $('planTitle').textContent = 'Согласование компонентов';
  $('items').replaceChildren();
  $('revision').value = '';
  componentCount = 0;
  flowApproved = false;
  hasFlowDraft = false;
  $('flowChat').replaceChildren();
  $('feedback').value = '';
  $('scenario').open = false;
  stage = 'list';
  readDraft = undefined;
  pendingMessage = undefined;
  clearTimeout(previewTimer);
  clearTimeout(imageTimer);
  if (activePreviewId) post('cancelPreview', { previewId: activePreviewId });
  activePreviewId = undefined;
  $('componentChat').replaceChildren();
}

$('retry').onclick = () => {
  if (busy || !lastRequest) return;
  setBusy(true);
  showWorking();
  if (lastModelRequest) {
    requestModel(lastModelRequest.prompt).then(raw => post(lastModelRequest.responseType, { raw }))
      .catch(error => { status(error.message, true); finishPending(error.message); setBusy(false); });
  } else post(lastRequest.type, lastRequest.data);
};

function finishPending(text) {
  if (pendingMessage) addMessage('componentChat', 'GigaCode', text);
}

function sendRequest(type, data) {
  lastRequest = { type, data };
  lastModelRequest = undefined;
  post(type, data);
}

$('lightboxSize').onchange = () => {
  if (!busy) {
    status('');
    setBusy(false);
  }
};

$('place').onclick = () => {
  const size = selectedSize();
  if (busy || !size) return;
  resetPlan();
  setBusy(true);
  status('Ставлю LightBox ' + size + ' в Pixso…');
  placementTimer = setTimeout(() => {
    placementTimer = undefined;
    setBusy(false);
    status('Pixso не ответил за 20 секунд. Переоткройте окно локального плагина и попробуйте снова.', true);
  }, 20000);
  post('placeLightbox', { size });
};

for (const id of ['task', 'token']) {
  $(id).addEventListener('input', resetPlan);
}

$('prepare').onclick = () => {
  if (busy) return;
  if (!$('token').value.trim()) {
    $('modelSettings').open = true;
    status('Введите код подключения из терминала.');
    return;
  }
  resetPlan();
  setBusy(true);
  $('plan').hidden = false;
  addMessage('componentChat', 'Вы', $('task').value.trim());
  showWorking();
  status('Готовлю запрос…');
  sendRequest('prepare', { task: $('task').value.trim(), standard: $('standard').value });
};

$('revise').onclick = () => {
  if (busy) return;
  const revision = $('revision').value.trim();
  if (!revision) {
    status('Опишите, что изменить в предложении.');
    return;
  }
  setBusy(true);
  status('Обновляю предложение…');
  addMessage('componentChat', 'Вы', revision);
  showWorking();
  sendRequest('dialog', { revision, draft: readDraft?.() });
};

function addMessage(chat, author, text) {
  if (!text) return;
  const item = document.createElement('li');
  item.className = 'message' + (author === 'Вы' ? ' user' : '');
  const name = document.createElement('strong');
  name.textContent = author;
  item.append(name, '\n' + text);
  if (chat === 'componentChat' && author === 'GigaCode' && pendingMessage) {
    pendingMessage.replaceWith(item);
    pendingMessage = null;
  } else $(chat).appendChild(item);
  return item;
}

function showWorking() {
  pendingMessage = addMessage('componentChat', 'GigaCode', 'GigaChat работает…');
}

function componentLine(item) {
  const name = item.readOnly ? (item.name.includes(' / ') ? item.name.replace(' / ', ' read-only / ') : item.name + ' read-only') : item.name;
  return item.text + ' · ' + name +
    (item.requestedReadOnly && !item.readOnly ? ' · read-only недоступен в этом варианте' : '');
}

function fieldLabel(key) {
  const name = key.replace(/#.*$/, '');
  if (/^(label|caption|title|field[ _-]?label|подпись|заголовок)$/i.test(name)) return 'Подпись';
  if (/^(placeholder|плейсхолдер)$/i.test(name)) return 'Подсказка';
  if (/^(value|input[ _-]?value|значение)$/i.test(name)) return 'Значение';
  return name;
}

for (const id of ['task', 'standard', 'feedback']) {
  $(id).addEventListener('input', () => {
    flowApproved = false;
    hasFlowDraft = false;
    post('invalidateFlow');
    setBusy(busy);
  });
}

$('approveFlow').onclick = () => {
  if (busy || !hasFlowDraft) return;
  setBusy(true);
  post('approveFlow');
};

$('flowSend').onclick = () => {
  if (busy) return;
  if (!$('token').value.trim()) {
    $('modelSettings').open = true;
    status('Введите код подключения из терминала.');
    return;
  }
  const feedback = $('feedback').value.trim();
  flowApproved = false;
  hasFlowDraft = false;
  addMessage('flowChat', 'Вы', feedback || $('task').value.trim());
  setBusy(true);
  status('GigaCode проектирует сценарий…');
  post('requestFlow', { requirements: $('task').value, standard: $('standard').value, feedback });
};

$('createStates').onclick = () => {
  if (busy) return;
  setBusy(true);
  post('createStates');
};

$('apply').onclick = () => {
  if (busy) return;
  setBusy(true);
  status('Собираю экран в Pixso…');
  post('apply');
};

async function requestModel(prompt) {
  if (typeof prompt !== 'string' || !prompt.trim()) throw new Error('Плагин сформировал пустой запрос.');
  if (prompt.length > 48000) throw new Error('Контекст диалога превышает лимит моста: ' + prompt.length + ' из 48000 символов. Запрос не отправлен.');
  let response;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 100000);
  try {
    response = await fetch('http://127.0.0.1:43127/plan', {
      signal: controller.signal,
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + $('token').value.trim() },
      redirect: 'error',
      body: JSON.stringify({ prompt })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Ошибка GigaCode CLI.');
    return data.result;
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('Ответ не получен за 100 секунд. Нажмите «Повторить отправку».');
    throw new Error(error.message || 'Не удалось подключиться. Проверьте, что мост GigaCode запущен на этом компьютере и Pixso разрешён доступ к нему.');
  } finally { clearTimeout(timer); }
}

$('openProperties').onclick = () => {
  setBusy(true);
  addMessage('componentChat', 'Вы', 'Подтвердить набор компонентов');
  status('Готовлю превью…');
  post('openProperties');
};
function renderItem(index, item) {
  const card = document.createElement('li');
  const heading = document.createElement('strong');
  heading.textContent = componentLine(item);
  card.appendChild(heading);
  const actions = document.createElement('p');
  card.appendChild(actions);
  const preview = document.createElement('div');
  card.appendChild(preview);
  replacePreview = result => {
    clearTimeout(imageTimer);
    activePreviewId = result.pending ? result.previewId : undefined;
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = undefined;
    preview.replaceChildren();
    if (result.png?.length) {
      const image = document.createElement('img');
      image.alt = 'Превью ' + result.name;
      previewUrl = URL.createObjectURL(new Blob([new Uint8Array(result.png)], { type: 'image/png' }));
      image.onerror = () => {
        replacePreview({ previewError: 'Не удалось открыть изображение, полученное от Pixso.' });
      };
      image.src = previewUrl;
      preview.appendChild(image);
    } else {
      const note = document.createElement('p');
      note.dataset.previewStatus = '';
      note.textContent = result.pending ? 'Готовлю превью…' : 'Превью недоступно' + (result.previewError ? ' — ' + result.previewError : '');
      preview.appendChild(note);
      if (result.pending) {
        previewStage = 'Создан экземпляр, ожидаю подготовку';
        post('renderPreview', { previewId: result.previewId });
        imageTimer = setTimeout(() => {
        post('cancelPreview', { previewId: result.previewId });
        replacePreview({ previewError: 'Остановилось на этапе «' + previewStage + '». Нажмите «Обновить превью», чтобы повторить.' });
        }, 20000);
      }
    }
  };
  replacePreview({ ...item, pending: Boolean(item.previewId) });
  if (item.optionExample) {
    const example = document.createElement('p');
    example.className = 'hint';
    example.textContent = 'Пример пункта списка — ' + item.optionExample;
    card.appendChild(example);
  }
  const variant = document.createElement('select');
  item.variants.forEach((name, i) => variant.add(new Option(name, i)));
  variant.value = item.variant;
  const state = document.createElement('label');
  state.textContent = 'Базовый вариант';
  state.appendChild(variant);
  const settings = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = 'Вариант и свойства';
  settings.append(summary, state);
  card.appendChild(settings);
  if (item.missing?.includes('подпись') && item.copy.some(copy => copy.title === 'Подпись')) {
    const note = document.createElement('p');
    note.className = 'hint';
    note.textContent = 'Подпись не привязана к текстовому слою. Проверьте доступные поля или смените вариант.';
    card.appendChild(note);
  }
  const fields = new Map();
  for (const field of item.fields) {
    const label = document.createElement('label');
    label.textContent = fieldLabel(field.key);
    const input = document.createElement('input');
    input.type = field.type === 'BOOLEAN' ? 'checkbox' : 'text';
    if (input.type === 'checkbox') input.checked = Boolean(field.value);
    else input.value = field.value ?? '';
    fields.set(field.key, input);
    label.appendChild(input);
    if (field.type === 'BOOLEAN') settings.appendChild(label);
    else card.insertBefore(label, settings);
  }
  if (!item.fields.some(field => field.type === 'TEXT')) {
    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'На фрейме останется текст компонента. Чтобы заполнить поле, проверьте вариант и свойства.';
    card.appendChild(hint);
  }
  if (stage === 'copy') {
    if (fields.size && item.copy.length) {
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = 'Впишите подходящие предложения из чата прямо в свойства компонента.';
      card.insertBefore(hint, settings);
    }
  }
  const errors = document.createElement('fieldset');
  const legend = document.createElement('legend');
  legend.textContent = 'Ошибки';
  const addError = document.createElement('button');
  addError.type = 'button';
  addError.textContent = 'Добавить ошибку';
  const errorRows = new Map();
  const appendError = (condition = '', message = '') => {
    const row = document.createElement('div');
    const when = document.createElement('input');
    const what = document.createElement('input');
    for (const [labelText, input, value] of [['Когда показать', when, condition], ['Что написать', what, message]]) {
      const label = document.createElement('label');
      label.textContent = labelText;
      input.value = value;
      label.appendChild(input);
      row.appendChild(label);
    }
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = 'Удалить ошибку';
    remove.onclick = () => {
      errorRows.delete(when);
      row.remove();
    };
    row.appendChild(remove);
    errorRows.set(when, what);
    errors.insertBefore(row, addError);
  };
  errors.append(legend, addError);
  for (const line of (item.error || '').split('\n').filter(Boolean)) {
    const separator = line.indexOf(' — ');
    if (separator < 0) appendError('', line);
    else appendError(line.slice(0, separator), line.slice(separator + 3));
  }
  addError.onclick = () => appendError();
  card.appendChild(errors);
  const confirm = document.createElement('button');
  confirm.type = 'button';
  confirm.textContent = 'Подтвердить компонент';
  actions.appendChild(confirm);
  const refresh = document.createElement('button');
  refresh.type = 'button';
  refresh.textContent = 'Обновить превью';
  actions.appendChild(refresh);
  card.addEventListener('input', event => {
    if (event.target === variant || errors.contains(event.target)) return;
    clearTimeout(previewTimer);
    previewTimer = setTimeout(() => {
      if (!busy && card.isConnected) post('previewItem', { ...readDraft(), live: true });
    }, 400);
  });
  variant.onchange = () => {
    clearTimeout(previewTimer);
    setBusy(true);
    post('chooseVariant', readDraft());
  };
  readDraft = () => ({
    index, variant: Number(variant.value),
    values: Object.fromEntries(Array.from(fields, ([key, input]) =>
      [key, input.type === 'checkbox' ? input.checked : input.value])),
    error: Array.from(errorRows, ([when, what]) =>
      [when.value.trim(), what.value.trim()].filter(Boolean).join(' — ')).filter(Boolean).join('\n')
  });
  const sendValues = type => {
    clearTimeout(previewTimer);
    setBusy(true);
    post(type, readDraft());
  };
  refresh.onclick = () => sendValues('previewItem');
  confirm.onclick = () => {
    const details = Array.from(fields, ([key, input]) => key.replace(/#.*$/, '') + ' — ' +
      (input.type === 'checkbox' ? (input.checked ? 'включено' : 'выключено') : input.value));
    details.push('Ошибки — ' + (readDraft().error || 'без ошибок'));
    addMessage('componentChat', 'Вы', heading.textContent + '\n' + details.join('\n'));
    sendValues('confirmItem');
  };
  return card;
}

window.addEventListener('message', async event => {
  if (event.source && event.source !== parent) return;
  const message = event.data?.pluginMessage;
  if (!message) return;
  try {
  switch (message.type) {
    case 'flowRequest':
      try {
        post('reviewFlow', { raw: await requestModel(message.prompt) });
        return;
      } catch (error) {
        status(error.message, true);
        finishPending(error.message);
      }
      break;
    case 'flowProposal':
      $('feedback').value = '';
      hasFlowDraft = message.states.length > 0;
      addMessage('flowChat', 'GigaCode', [message.reply, ...message.states.map(state => [
        state.name + ' — ' + state.condition,
        ...Object.entries(state.values).map(([label, value]) => label + ' — ' + value),
        ...state.errors.map(error => 'Ошибка ' + (error.field || 'формы') + ' — ' + error.text)
      ].join('\n'))].join('\n\n'));
      status('');
      break;
    case 'flowApproved':
      flowApproved = true;
      status('Состояния и тексты ошибок утверждены.');
      break;
    case 'statesCreated':
      status('Создано фреймов: ' + message.count + (message.skipped ? ' · Не удалось заполнить значений: ' + message.skipped : '') +
        (message.errorsPending ? ' · Текстов ошибок для ручного оформления: ' + message.errorsPending : ''));
      break;
    case 'dialogRequest':
      lastModelRequest = { prompt: message.prompt, responseType: 'reviewDialog' };
      try { post('reviewDialog', { raw: await requestModel(message.prompt) }); return; }
      catch (error) { status(error.message, true); finishPending(error.message); }
      break;
    case 'dialogReply':
      lastRequest = undefined;
      lastModelRequest = undefined;
      addMessage('componentChat', 'GigaCode', message.reply);
      break;
    case 'prepared':
      lastModelRequest = { prompt: message.prompt, responseType: 'review' };
      status('GigaCode подбирает компоненты…');
      try {
        post('review', { raw: await requestModel(message.prompt) });
        return;
      } catch (error) {
        status(error.message, true);
        finishPending(error.message);
      }
      break;
    case 'proposal':
      lastRequest = undefined;
      lastModelRequest = undefined;
      stage = 'list';
      componentCount = message.items.length;
      $('items').replaceChildren();
      readDraft = undefined;
      $('planTitle').textContent = 'Согласование компонентов';
      $('revision').value = '';
      addMessage('componentChat', 'GigaCode', [message.reply, ...message.items.map(item =>
        componentLine(item))].filter(Boolean).join('\n') || 'Список компонентов пуст.');
      $('target').textContent = 'Фрейм для вставки — ' + (message.target || 'выбранный фрейм');
      $('plan').hidden = false;
      status(message.items.length ? '' : 'В предложении больше нет компонентов.');
      break;
    case 'copyRequest':
      try {
        post('reviewCopy', { raw: await requestModel(message.prompt) });
        return;
      } catch (error) {
        status(error.message, true);
        finishPending(error.message);
      }
      break;
    case 'componentOpened':
    case 'copyOpened':
      stage = 'copy';
      $('planTitle').textContent = 'Компонент ' + (message.index + 1) + ' из ' + message.total;
      $('items').replaceChildren(renderItem(message.index, message.item));
      if (message.type === 'copyOpened') {
        $('revision').value = '';
        addMessage('componentChat', 'GigaCode', [message.reply, ...message.item.fields.filter(field => field.type === 'TEXT' && field.value).map(field =>
          field.key.replace(/#.*$/, '') + ' — ' + field.value), ...message.item.copy.map(copy =>
          copy.title + ' — ' + copy.value), message.item.error].filter(Boolean).join('\n'));
      }
      status('');
      break;
    case 'itemPreview':
      if (stage === 'copy') replacePreview?.({ ...message.item, pending: Boolean(message.item.previewId) });
      return;
    case 'previewProgress':
      if (activePreviewId === message.previewId) {
        previewStage = message.stage;
        const note = $('items').querySelector('[data-preview-status]');
        if (note) note.textContent = message.stage + '…';
      }
      return;
    case 'previewRendered':
      if (stage === 'copy' && activePreviewId === message.item.previewId) replacePreview?.(message.item);
      return;
    case 'itemConfigured':
      $('items').replaceChildren(renderItem(message.index, message.item));
      status('');
      break;
    case 'readyToApply':
      clearTimeout(imageTimer);
      if (activePreviewId) post('cancelPreview', { previewId: activePreviewId });
      activePreviewId = undefined;
      stage = 'ready';
      $('items').replaceChildren();
      $('planTitle').textContent = 'Компоненты согласованы';
      status('');
      break;
    case 'applied':
      hasSource = true;
      stage = 'done';
      addMessage('componentChat', 'Плагин', 'Добавлено компонентов: ' + message.count + ' · ' + message.target);
      status('');
      break;
    case 'formPlaced':
      hasSource = false;
      clearTimeout(placementTimer);
      placementTimer = undefined;
      formPlaced = true;
      $('formSetup').hidden = false;
      $('modelSettings').open = !$('token').value.trim();
      status('LightBox ' + message.size + ' поставлен.');
      break;
    case 'error':
      if (!$('plan').hidden) addMessage('componentChat', 'Плагин', message.message);
      clearTimeout(placementTimer);
      placementTimer = undefined;
      status(message.message, true);
      break;
    default:
      return;
  }
  if (pendingMessage) {
    pendingMessage.remove();
    pendingMessage = null;
  }
  setBusy(false);
  } catch (error) {
    clearTimeout(imageTimer);
    if (activePreviewId) post('cancelPreview', { previewId: activePreviewId });
    activePreviewId = undefined;
    const detail = 'Ошибка отображения (' + message.type + '): ' + (error.message || String(error));
    status(detail, true);
    finishPending(detail);
    setBusy(false);
  }
});

setBusy(false);
status('');
</script>
</body>
</html>
