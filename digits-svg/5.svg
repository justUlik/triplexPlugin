        <feMergeNode in="whiteRim"/>
      </feMerge>
    </filter>
    <filter id="softHighlight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.25"/>
    </filter>
  </defs>
  <g filter="url(#volume)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M957 532 H887 V573 H946 Q957 573 957 584 V612 Q957 622 946 622 H887" stroke="url(#pink)" stroke-width="27"/>
    <path d="M957 532 H887 V573 H946 Q957 573 957 584 V612 Q957 622 946 622 H887" stroke="url(#highlight)" stroke-width="15" transform="translate(1 1)" filter="url(#softHighlight)"/>
