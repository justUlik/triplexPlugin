<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="397 275 144 144" role="img" aria-label="0">
  <defs>
    <linearGradient id="pink" gradientUnits="userSpaceOnUse" x1="415" y1="374" x2="524" y2="320">
      <stop stop-color="#ff7658"/>
      <stop offset=".52" stop-color="#d5294b"/>
      <stop offset="1" stop-color="#570b1c"/>
    </linearGradient>
    <linearGradient id="highlight" gradientUnits="userSpaceOnUse" x1="397" y1="285" x2="397" y2="409">
      <stop stop-color="#ff9870" stop-opacity=".43"/>
      <stop offset=".68" stop-color="#ff4b69" stop-opacity=".9"/>
      <stop offset="1" stop-color="#df284b" stop-opacity=".76"/>
    </linearGradient>
    <filter id="volume" filterUnits="userSpaceOnUse" x="397" y="275" width="144" height="144" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="erode" radius="1.35" result="inner"/>
      <feGaussianBlur in="inner" stdDeviation=".65" result="softInner"/>
      <feComposite in="SourceAlpha" in2="softInner" operator="out" result="rim"/>
      <feFlood flood-color="#ffb4a8" flood-opacity=".28" result="rimColor"/>
      <feComposite in="rimColor" in2="rim" operator="in" result="whiteRim"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="whiteRim"/>
      </feMerge>
    </filter>
    <filter id="softHighlight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.25"/>
    </filter>
  </defs>
  <g filter="url(#volume)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M508 319 C487 291 453 296 435 315 C416 334 420 367 439 383 C465 405 507 391 515 354" stroke="url(#pink)" stroke-width="27"/>
    <path d="M508 319 C487 291 453 296 435 315 C416 334 420 367 439 383 C465 405 507 391 515 354" stroke="url(#highlight)" stroke-width="15" transform="translate(1 1)" filter="url(#softHighlight)"/>
  </g>
</svg>
