  <g filter="url(#volume)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1795 533 H1858 C1870 533 1876 542 1869 551 L1808 624" stroke="url(#pink)" stroke-width="27"/>
    <path d="M1795 533 H1858 C1870 533 1876 542 1869 551 L1808 624" stroke="url(#highlight)" stroke-width="15" transform="translate(1 1)" filter="url(#softHighlight)"/>
